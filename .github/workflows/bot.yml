name: TikTok Recorder Bot

on:
  schedule:
    # لم نعد نحتاج لتوقيتات معقدة! توقيت واحد فقط لإيقاظ البوت بعد الاستراحة
    # هذا التوقيت يعادل الساعة 9:00 صباحاً بتوقيت بغداد
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Libraries
        run: pip install -r requirements.txt

      - name: Run Bot and Relay
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GH_TOKEN: ${{ secrets.GH_PAT }}  # الرمز السري الجديد الذي أضفناه
        run: |
          set +e # لمنع توقف الخادم بشكل خاطئ
          python main.py
          EXIT_CODE=$?
          
          # إذا كان كود الخروج هو 42، فهذا يعني أن البوت يطلب إطلاق الخادم الذي يليه
          if [ $EXIT_CODE -eq 42 ]; then
            echo "🚀 Launching the next server immediately with ZERO delay..."
            gh workflow run bot.yml --ref main
          else
            echo "💤 Entering break mode until 9:00 AM."
          fi
