name: TikTok Recorder Bot

on:
  schedule:
    # تداخل لمدة 3 دقائق فقط لتجنب المقاطع المكررة الطويلة
    - cron: '0 6 * * *'    # الدورة الأولى: تبدأ 9:00 صباحاً
    - cron: '27 11 * * *'  # الدورة الثانية: تبدأ 2:27 ظهراً (تتداخل 3 دقائق مع نهاية الأولى)
    - cron: '54 16 * * *'  # الدورة الثالثة: تبدأ 7:54 مساءً (تتداخل 3 دقائق مع الثانية)
    - cron: '21 22 * * *'  # الدورة الرابعة: تبدأ 1:21 ليلاً (تتداخل 3 دقائق مع الثالثة)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Libraries
        run: |
          pip install -r requirements.txt

      - name: Run Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python main.py
